<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memo-Nexus Web Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Memo-Nexus Web Clipper</h1>
    <p class="version">拡張機能バージョン: <span id="extensionVersion">—</span></p>
    <p id="environmentStatus" class="environment-status">接続先を確認中…</p>
    <p id="updateStatus" class="update-status" role="status" aria-live="polite"></p>
    <p id="selectionStatus" class="status">ページ情報を取得中…</p>
    <label>クリップ方式<select id="clipMode"><option value="selection">選択部分</option><option value="page">ページ全文</option><option value="link">リンクのみ</option><option value="memo">メモ付き</option></select></label>
    <ul class="status" aria-label="利用できるクリップ方式"><li>選択部分</li><li>ページ全文（本文・画像を取得してから確認画面を開く）</li><li>リンクのみ</li><li>メモ付き</li></ul>
    <p id="modeStatus" class="status"></p>
    <dl>
      <div><dt>タイトル</dt><dd id="title">—</dd></div>
      <div><dt>URL</dt><dd id="url">—</dd></div>
    </dl>
    <label>接続先<select id="target"></select></label>
    <label id="userMemoRow" hidden>メモ<textarea id="userMemo" maxlength="1000" rows="3" placeholder="あとで確認、重要な理由など"></textarea></label>
    <button id="send" type="button" disabled>Memo-Nexusで確認する</button>
    <p id="error" class="error" role="alert"></p>
  </main>
  <script src="config.js"></script>
  <script src="transfer-lifecycle.js"></script>
  <script src="update-manager.js"></script>
  <script src="clip-payload.js"></script>
  <script src="page-extractor.js"></script>
  <script src="html-to-markdown.js"></script>
  <script src="popup.js"></script>
</body>
</html>
