name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      combo_profile:
        description: Run and profile only the composite Chart E2E on WebKit
        type: boolean
        default: false
      dual_axis_profile:
        description: Profile dual-axis Chart E2E on WebKit
        type: boolean
        default: false
      tooltip_profile:
        description: Profile tooltip Chart E2E on WebKit
        type: boolean
        default: false
      card_click_trace:
        description: Trace selected Chart card clicks on WebKit when both profiles are enabled
        type: boolean
        default: false
      tooltip_diagnostic:
        description: Diagnose the tooltip c10 light 320 card click on WebKit
        type: boolean
        default: false
      card_click_internals:
        description: Measure all 96 tooltip card click boundaries on WebKit
        type: boolean
        default: false
      tooltip_handler_boundary:
        description: Observe selected tooltip click capture to post-app listener boundaries on WebKit
        type: boolean
        default: false
      tooltip_click_boundaries:
        description: Measure ten tooltip click pointer, focus, handler and rAF boundaries on WebKit
        type: boolean
        default: false
      tooltip_t0_t1_trace:
        description: Save three tooltip card locator.click traces on WebKit
        type: boolean
        default: false
      stable_frames:
        description: Capture selected tooltip Stable phases, frame geometry and traces on WebKit
        type: boolean
        default: false
      webkit_inspector_timeline:
        description: Probe WebKit Inspector Timeline access on Ubuntu
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        shell: bash
        run: |
          mapfile -d '' files < <(
            find . -type d -name node_modules -prune -o -type f -name '*.js' -print0
          )
          count="${#files[@]}"
          echo "JavaScript files: $count"
          if (( count == 0 )); then
            echo "::error::No JavaScript files found"
            exit 1
          fi
          printf '%s\0' "${files[@]}" | xargs -0 -n 1 node --check

      - name: Check whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              if [[ -z "$PR_BASE_SHA" || -z "$PR_HEAD_SHA" ]]; then
                echo "::error::Pull request SHA is missing"
                exit 1
              fi
              git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
              ;;
            push)
              if [[ -z "$PUSH_BEFORE_SHA" || -z "$CURRENT_SHA" ]]; then
                echo "::error::Push SHA is missing"
                exit 1
              fi
              if [[ "$PUSH_BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
                git show --check --format=fuller "$CURRENT_SHA"
              else
                git diff --check "$PUSH_BEFORE_SHA...$CURRENT_SHA"
              fi
              ;;
            workflow_dispatch)
              if [[ -z "$CURRENT_SHA" ]]; then
                echo "::error::Current SHA is missing"
                exit 1
              fi
              git show --check --format=fuller "$CURRENT_SHA"
              ;;
            *)
              echo "::error::Unsupported event: $EVENT_NAME"
              exit 1
              ;;
          esac

  report-fixed-e2e:
    name: Fixed report samples (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Prepare PDF inspection and fonts
        run: |
          python -m pip install pymupdf==1.27.2
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify fixed samples
        env:
          MEMO_NEXUS_E2E_BROWSER: ${{ matrix.browser }}
        run: |
          mkdir -p "e2e-artifacts/report-fixed/${{ matrix.browser }}"
          npm run test:e2e:report-fixed 2>&1 | tee "e2e-artifacts/report-fixed/${{ matrix.browser }}/run.log"
      - name: Upload all results including failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: report-fixed-${{ matrix.browser }}
          path: e2e-artifacts/report-fixed/${{ matrix.browser }}/
          if-no-files-found: error
          retention-days: 14

  figure-e2e:
    name: Figure E2E (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Figure metadata E2E
        run: npm run test:e2e:figure

      - name: Run Comparison E2E
        run: npm run test:e2e:comparison

      - name: Upload Comparison review screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: comparison-review
          path: e2e-artifacts/comparison-*.png
          if-no-files-found: error
          retention-days: 14

      - name: Run Report Preview E2E
        run: npm run test:e2e:report-preview

      - name: Upload Report numbering screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: report-numbering-review
          path: e2e-artifacts/report-numbering-review/
          if-no-files-found: error
          retention-days: 14

      - name: Prepare PDF inspection
        run: |
          python -m pip install pymupdf==1.27.2
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Run Report PDF E2E
        run: npm run test:e2e:report-pdf

      - name: Upload Report PDF review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: report-pdf-review
          path: e2e-artifacts/report-pdf-review/
          if-no-files-found: error
          retention-days: 14

      - name: Run Timeline E2E
        run: npm run test:e2e:timeline

      - name: Clear Diagram review screenshots
        shell: bash
        run: rm -rf -- e2e-artifacts/diagram-review

      - name: Run Diagram E2E
        run: npm run test:e2e:diagram

      - name: Upload Diagram review screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diagram-review
          path: e2e-artifacts/diagram-review/diagram-*.png
          if-no-files-found: error
          retention-days: 14

      - name: Run Citation Source E2E
        run: npm run test:e2e:citation-source

  mobile-e2e:
    name: Mobile E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - webkit

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run mobile E2E
        env:
          MEMO_NEXUS_E2E_BROWSER: ${{ matrix.browser }}
          MEMO_NEXUS_E2E_SCREENSHOT: e2e-artifacts/mobile-layout-390-${{ matrix.browser }}.png
        run: npm run test:e2e:mobile

      - name: Upload mobile layout screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mobile-layout-${{ matrix.browser }}
          path: e2e-artifacts/mobile-layout-390-${{ matrix.browser }}.png
          if-no-files-found: error
          retention-days: 7

  chart-e2e:
    name: Chart E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - webkit

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Smoke actionability phase diagnostics
        if: matrix.browser == 'webkit'
        env:
          MEMO_NEXUS_E2E_STABLE_FRAMES: ${{ github.event_name == 'workflow_dispatch' && inputs.stable_frames && '1' || '' }}
        run: node chart-actionability-phase-smoke.e2e.js

      - name: Run chart E2E with feature and total durations
        env:
          MEMO_NEXUS_E2E_BROWSER: ${{ matrix.browser }}
          MEMO_NEXUS_E2E_COMBO_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.combo_profile && matrix.browser == 'webkit' && '1' || '' }}
          MEMO_NEXUS_E2E_DUAL_AXIS_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.dual_axis_profile && matrix.browser == 'webkit' && '1' || '' }}
          MEMO_NEXUS_E2E_TOOLTIP_PROFILE: ${{ github.event_name == 'workflow_dispatch' && (inputs.tooltip_profile || inputs.card_click_internals || inputs.tooltip_handler_boundary) && matrix.browser == 'webkit' && '1' || '' }}
          MEMO_NEXUS_E2E_CARD_CLICK_TRACE: ${{ github.event_name == 'workflow_dispatch' && inputs.card_click_trace && inputs.dual_axis_profile && inputs.tooltip_profile && matrix.browser == 'webkit' && '1' || '' }}
          MEMO_NEXUS_E2E_TOOLTIP_DIAGNOSTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.tooltip_diagnostic && matrix.browser == 'webkit' && '1' || '' }}
          MEMO_NEXUS_E2E_CARD_CLICK_INTERNALS: ${{ github.event_name == 'workflow_dispatch' && inputs.card_click_internals && matrix.browser == 'webkit' && '1' || '' }}
          MEMO_NEXUS_E2E_CARD_CLICK_INTERNALS_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.card_click_internals && '1' || '' }}
          MEMO_NEXUS_E2E_TOOLTIP_HANDLER_BOUNDARY: ${{ github.event_name == 'workflow_dispatch' && inputs.tooltip_handler_boundary && matrix.browser == 'webkit' && '1' || '' }}
          MEMO_NEXUS_E2E_TOOLTIP_HANDLER_BOUNDARY_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.tooltip_handler_boundary && '1' || '' }}
          MEMO_NEXUS_E2E_TOOLTIP_CLICK_BOUNDARIES: ${{ github.event_name == 'workflow_dispatch' && inputs.tooltip_click_boundaries && matrix.browser == 'webkit' && '1' || '' }}
          MEMO_NEXUS_E2E_TOOLTIP_CLICK_BOUNDARIES_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.tooltip_click_boundaries && '1' || '' }}
          MEMO_NEXUS_E2E_TOOLTIP_T0_T1_TRACE: ${{ github.event_name == 'workflow_dispatch' && inputs.tooltip_t0_t1_trace && matrix.browser == 'webkit' && '1' || '' }}
          MEMO_NEXUS_E2E_TOOLTIP_T0_T1_TRACE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.tooltip_t0_t1_trace && '1' || '' }}
          MEMO_NEXUS_E2E_STABLE_FRAMES: ${{ github.event_name == 'workflow_dispatch' && inputs.stable_frames && matrix.browser == 'webkit' && '1' || '' }}
          MEMO_NEXUS_E2E_ACTIONABILITY_PHASES: ${{ github.event_name == 'workflow_dispatch' && inputs.stable_frames && matrix.browser == 'webkit' && '1' || '' }}
          MEMO_NEXUS_E2E_STABLE_FRAMES_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.stable_frames && '1' || '' }}
        shell: bash
        run: |
          if [[ "$MEMO_NEXUS_E2E_CARD_CLICK_INTERNALS_REQUESTED" == "1" || "$MEMO_NEXUS_E2E_TOOLTIP_HANDLER_BOUNDARY_REQUESTED" == "1" || "$MEMO_NEXUS_E2E_TOOLTIP_CLICK_BOUNDARIES_REQUESTED" == "1" || "$MEMO_NEXUS_E2E_TOOLTIP_T0_T1_TRACE_REQUESTED" == "1" || "$MEMO_NEXUS_E2E_STABLE_FRAMES_REQUESTED" == "1" ]]; then
            npm run test:e2e:chart -- --feature chart-tooltips
          elif [[ "$MEMO_NEXUS_E2E_COMBO_PROFILE" == "1" ]]; then
            npm run test:e2e:chart -- --feature chart-combo
          else
            npm run test:e2e:chart:all
          fi

      - name: Verify dual-axis geometry after delayed preview rendering
        env:
          MEMO_NEXUS_E2E_BROWSER: ${{ matrix.browser }}
        run: node chart-axis-render-wait.e2e.js

      - name: Upload focused tooltip click traces
        if: always() && github.event_name == 'workflow_dispatch' && inputs.tooltip_t0_t1_trace && matrix.browser == 'webkit'
        uses: actions/upload-artifact@v6
        with:
          name: tooltip-t0-t1-traces-webkit
          path: e2e-artifacts/chart-card-click-traces/tooltip-*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Validate Stable frame diagnostics
        id: validate_stable_artifacts
        if: always() && github.event_name == 'workflow_dispatch' && inputs.stable_frames && matrix.browser == 'webkit'
        shell: bash
        run: |
          missing=0
          if ! compgen -G 'e2e-artifacts/chart-card-frame-observation/*/*.json' > /dev/null; then
            echo '::error::Missing Stable frame JSON artifact'
            missing=1
          fi
          if ! compgen -G 'e2e-artifacts/chart-card-frame-observation/*/traces/*.zip' > /dev/null; then
            echo '::error::Missing Stable frame Trace zip artifact'
            missing=1
          fi
          exit "$missing"

      - name: Upload Stable frame diagnostics
        if: always() && github.event_name == 'workflow_dispatch' && inputs.stable_frames && matrix.browser == 'webkit' && steps.validate_stable_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: tooltip-stable-frames-webkit
          path: |
            e2e-artifacts/chart-card-frame-observation/*/*.json
            e2e-artifacts/chart-card-frame-observation/*/traces/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload selected card click traces
        if: always() && github.event_name == 'workflow_dispatch' && inputs.card_click_trace && inputs.dual_axis_profile && inputs.tooltip_profile && matrix.browser == 'webkit'
        uses: actions/upload-artifact@v6
        with:
          name: chart-card-click-traces-webkit
          path: e2e-artifacts/chart-card-click-traces/*.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Upload selected card frame observations
        if: always() && github.event_name == 'workflow_dispatch' && inputs.card_click_trace && inputs.dual_axis_profile && inputs.tooltip_profile && matrix.browser == 'webkit'
        uses: actions/upload-artifact@v6
        with:
          name: chart-card-frame-observation-webkit
          path: e2e-artifacts/chart-card-frame-observation/*.json
          if-no-files-found: warn
          retention-days: 7

  webkit-inspector-timeline:
    name: WebKit Inspector Timeline diagnostic
    if: github.event_name == 'workflow_dispatch' && inputs.webkit_inspector_timeline
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit

      - name: Probe WebKit Inspector Timeline
        run: npm run test:e2e:webkit-inspector-timeline

      - name: Upload diagnostic JSONL
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: webkit-inspector-timeline
          path: e2e-artifacts/webkit-inspector-timeline.jsonl
          if-no-files-found: warn
          retention-days: 14

  table-e2e:
    name: Table E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - webkit

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Clear table E2E screenshots
        run: rm -rf "e2e-artifacts/table-file-import/${{ matrix.browser }}"

      - name: Run table block E2E
        env:
          MEMO_NEXUS_E2E_BROWSER: ${{ matrix.browser }}
        run: npm run test:e2e:table

      - name: Clear mixed Report Source review screenshots
        run: rm -rf "e2e-artifacts/report-source-review/${{ matrix.browser }}"

      - name: Run common Report Source E2E
        env:
          MEMO_NEXUS_E2E_BROWSER: ${{ matrix.browser }}
        run: npm run test:e2e:report-sources

      - name: Upload mixed Report Source review screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: report-sources-${{ matrix.browser }}
          path: e2e-artifacts/report-source-review/${{ matrix.browser }}/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload table file import screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: table-file-import-${{ matrix.browser }}
          path: e2e-artifacts/table-file-import/${{ matrix.browser }}
          if-no-files-found: error
          retention-days: 7

  geometry-e2e:
    name: Geometry E2E (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run geometry E2E
        run: npm run test:e2e:geometry

  dummy-preview-e2e:
    name: Unsaved dummy preview (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify isolated unsaved browser receive path
        run: npm run test:e2e:dummy-preview
      - name: Verify isolated received text and explicit save path
        run: npm run test:e2e:received-preview
      - name: Verify received preview concurrency in one browser storage area
        run: npm run test:e2e:received-concurrency
      - name: Verify multiple received notes and partial processing
        run: npm run test:e2e:received-notes
      - name: Preserve results including failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unsaved-dummy-preview
          path: |
            e2e-artifacts/dummy-preview/
            e2e-artifacts/received-preview/
          if-no-files-found: error
          retention-days: 14
