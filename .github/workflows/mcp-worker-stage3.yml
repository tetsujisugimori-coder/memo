name: MCP Worker stage3 diagnostic
on:
  pull_request:
    paths:
      - 'experiments/mcp-search-worker-feasibility/**'
      - '.github/workflows/mcp-worker-stage3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      WORKER_POC_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node --test experiments/mcp-search-worker-feasibility/shutdown-protocol.test.cjs
      - run: node experiments/mcp-search-worker-feasibility/poll-compare.cjs
      - name: An unexpected route exception must fail the runner
        run: |
          if POLL_INJECT_UNEXPECTED=1 node experiments/mcp-search-worker-feasibility/poll-compare.cjs; then
            echo 'Unexpected success after injected route exception'
            exit 1
          fi
      - run: node experiments/mcp-search-worker-feasibility/shared-ledger-browser.cjs
      - run: node experiments/mcp-search-worker-feasibility/ledger-restart-browser.cjs
      - run: node experiments/mcp-search-worker-feasibility/shutdown-browser.cjs
