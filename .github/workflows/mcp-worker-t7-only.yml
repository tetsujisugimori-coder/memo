name: MCP Worker T7 standalone
on:
  pull_request:
    paths:
      - 'experiments/mcp-search-worker-feasibility/**'
      - '.github/workflows/mcp-worker-t7-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t7:
    name: T7 standalone (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test experiments/mcp-search-worker-feasibility/recovery-model.test.cjs
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node experiments/mcp-search-worker-feasibility/recovery-browser.cjs
        env:
          WORKER_POC_BROWSER: ${{ matrix.browser }}
      - run: node experiments/mcp-search-worker-feasibility/t7-only.cjs
        env:
          WORKER_POC_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: t7-standalone-${{ matrix.browser }}
          path: e2e-artifacts/mcp-worker-diagnostics/t7-only-${{ matrix.browser }}-*.json
          if-no-files-found: warn
          retention-days: 14
