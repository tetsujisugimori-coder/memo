name: MCP Worker recovery research
on:
  pull_request:
    paths:
      - 'experiments/mcp-search-worker-recovery/**'
      - '.github/workflows/mcp-search-worker-recovery.yml'
  workflow_dispatch:
    inputs:
      finite_diagnosis:
        description: Explicitly authorize a new finite T7 diagnostic run
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test experiments/mcp-search-worker-recovery/supervisor.test.cjs
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Synthetic stop/recovery acceptance
        run: node experiments/mcp-search-worker-recovery/run.cjs
        env:
          WORKER_RECOVERY_BROWSER: ${{ matrix.browser }}
      # Initial finite diagnostic is preserved in run 41066494950; do not repeat on repair pushes.
      - name: Explicit finite T7 diagnosis (not recovery acceptance)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.finite_diagnosis
        run: node experiments/mcp-search-worker-recovery/t7-run.cjs
        env:
          WORKER_POC_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: worker-recovery-${{ matrix.browser }}
          path: |
            e2e-artifacts/worker-recovery/*.json
            e2e-artifacts/mcp-worker-recovery/*.json
          if-no-files-found: error
          retention-days: 14
