<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memo Nexus</title>
  <link rel="stylesheet" href="style.css?v=0.4.0-7">
</head>
<body>
  <aside class="sidebar">
    <div class="toolbar">
      <button id="newBtn" title="新規メモ">+</button>
      <button id="collectionsBtn" title="コレクションを開く" aria-controls="collectionExplorer" aria-expanded="false">▱ コレクション</button>
      <button id="todayBtn" title="今日メモ">Today</button>
      <button id="undoBtn" class="undo-button" title="元に戻す" disabled>Undo</button>
      <button id="backupBtn" title="Markdown ZIP出力">ZIP</button>
      <button id="linkStatsBtn" title="語句統計">語句</button>
      <button id="graphBtn" title="グラフを開く">Graph</button>
      <button id="settingsBtn" title="設定">設定</button>
      <button id="deleteBtn" class="danger-button" title="メモを削除">Del</button>
    </div>
    <div class="app-version app-version-mobile"></div>
    <div id="deleteUndoNotice" class="delete-undo-notice" hidden></div>
    <input id="searchInput" type="search" placeholder="検索" autocomplete="off">
    <div id="memoList" class="memo-list"></div>
  </aside>

  <div id="collectionBackdrop" class="collection-backdrop" hidden></div>
  <aside id="collectionExplorer" class="collection-explorer" aria-label="コレクション・エクスプローラ" aria-hidden="true">
    <div class="collection-head">
      <strong>コレクション</strong>
      <div class="collection-head-actions">
        <button id="addCollectionBtn" type="button" title="コレクションを作成" aria-label="コレクションを作成">＋</button>
        <button id="collectionAddMenuBtn" type="button" title="作成場所を選ぶ" aria-label="作成場所を選ぶ">▾</button>
        <button id="closeCollectionsBtn" type="button" title="閉じる" aria-label="コレクションを閉じる">×</button>
      </div>
    </div>
    <div id="collectionAddMenu" class="collection-popup-menu" hidden></div>
    <div id="collectionSelectionBar" class="collection-selection-bar" hidden></div>
    <div class="collection-sort-bar">
      <label for="collectionSortSelect">作成日：</label>
      <select id="collectionSortSelect" class="collection-sort-select" aria-label="コレクション内メモの並び順">
        <option value="newest">新しい順</option>
        <option value="oldest">古い順</option>
      </select>
    </div>
    <div id="collectionTree" class="collection-tree" role="tree" tabindex="0" aria-label="コレクション一覧"></div>
    <div id="collectionMenu" class="collection-popup-menu collection-context-menu" hidden></div>
    <div id="collectionToast" class="collection-toast" role="status" aria-live="polite" hidden></div>
  </aside>

  <main class="workspace">
    <div id="storageWarning" class="storage-warning" role="status" hidden></div>
    <section class="editor-card">
      <div class="title-row">
        <input id="titleInput" class="title-input" placeholder="無題メモ" autocomplete="off">
        <div class="title-side">
          <div class="title-side-head">
            <button id="noteExportBtn" class="note-export-button" type="button" title="このメモをエクスポート" aria-label="このメモをエクスポート">…</button>
            <div id="saveStatus" class="save-status">保存済み</div>
          </div>
          <div id="noteMeta" class="note-meta"></div>
        </div>
      </div>
      <textarea id="editor" placeholder="すぐ書けます。[[足利尊氏]] のように書くとリンクになります。"></textarea>
    </section>
    <section class="preview-card">
      <div class="preview-head">
        <span>カード表示</span>
      </div>
      <div id="preview" class="preview"></div>
      <div id="linkList" class="link-list"></div>
      <div id="linkStatsPanel" class="link-stats"></div>
      <section id="attachmentSection" class="attachment-section" aria-labelledby="attachmentHeading">
        <div class="attachment-head">
          <div>
            <strong id="attachmentHeading">添付ファイル</strong>
            <span id="attachmentCount">0件</span>
          </div>
          <button id="addAttachmentBtn" type="button">ファイルを追加</button>
          <input id="attachmentInput" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf,image/jpeg,image/png,image/webp,application/pdf" multiple hidden>
        </div>
        <div id="attachmentUsage" class="attachment-usage">使用容量 0 B / 20.0 MB</div>
        <div id="attachmentStatus" class="attachment-status" role="status" aria-live="polite"></div>
        <div id="attachmentDropZone" class="attachment-drop-zone" tabindex="0">画像またはPDFを選択するか、ここへドロップ</div>
        <div id="attachmentList" class="attachment-list"></div>
      </section>
    </section>
  </main>

  <aside class="related-panel">
    <h2>関連メモ</h2>
    <div class="app-version app-version-desktop"></div>
    <div id="relatedList" class="related-list"></div>
    <div id="discoveryPanel" class="discovery-panel"></div>
  </aside>

  <dialog id="graphDialog">
    <div class="dialog-head">
      <strong>知識グラフ</strong>
      <button id="closeGraphBtn" title="閉じる">×</button>
    </div>
    <canvas id="graphCanvas" width="900" height="560"></canvas>
  </dialog>

  <dialog id="settingsDialog" class="settings-dialog">
    <div class="dialog-head">
      <strong>設定</strong>
      <button id="closeSettingsBtn" title="閉じる">×</button>
    </div>
    <div class="settings-body">
      <section class="settings-section">
        <h2>保存状態</h2>
        <dl id="storageStatusDetails" class="settings-details"></dl>
        <p id="storageEstimateMessage" class="settings-note"></p>
      </section>
      <section class="settings-section">
        <h2>取り込み</h2>
        <div class="settings-actions">
          <button id="settingsImportAiBtn" type="button">AIニュースファイル取り込み</button>
          <input id="importAiInput" type="file" accept=".json,.md,.txt,application/json,text/markdown,text/plain" hidden>
          <button id="settingsPasteJsonBtn" type="button">JSON貼り付け取り込み</button>
        </div>
      </section>
      <section class="settings-section">
        <h2>バックアップ</h2>
        <div class="settings-actions">
          <button id="settingsBackupBtn" type="button">Markdown ZIPを書き出す</button>
          <button type="button" class="soon-button" disabled>JSON全体を書き出す <span>Coming soon</span></button>
        </div>
      </section>
      <section class="settings-section">
        <h2>表示</h2>
        <label class="theme-setting" for="themeSelect">
          <span>テーマ</span>
          <select id="themeSelect">
            <option value="light">ライト</option>
            <option value="dark">ダーク</option>
          </select>
        </label>
        <ul class="soon-list">
          <li>フォントサイズ <span>Coming soon</span></li>
          <li>行間 <span>Coming soon</span></li>
          <li>エディタ幅 <span>Coming soon</span></li>
          <li>プレビュー表示切替 <span>Coming soon</span></li>
          <li>関連メモ表示切替 <span>Coming soon</span></li>
          <li>レトロモード <span>Coming soon</span></li>
        </ul>
      </section>
      <section class="settings-section">
        <h2>データ管理</h2>
        <div class="settings-actions">
          <button id="reloadAppBtn" type="button">アプリを再読み込み</button>
          <button type="button" class="soon-button danger-button" disabled>全データ削除 <span>危険操作のため未実装</span></button>
        </div>
      </section>
    </div>
  </dialog>

  <dialog id="jsonImportDialog" class="json-import-dialog">
    <div class="dialog-head">
      <strong>JSON取り込み</strong>
      <button id="closeJsonImportBtn" title="閉じる">×</button>
    </div>
    <div class="json-import-body">
      <textarea id="jsonImportText" placeholder="IT技術ニュースJSONを貼り付け"></textarea>
      <div id="jsonImportError" class="json-import-error" aria-live="polite"></div>
      <div class="json-import-actions">
        <button id="cancelJsonImportBtn" type="button">キャンセル</button>
        <button id="runJsonImportBtn" type="button">取り込み</button>
      </div>
    </div>
  </dialog>

  <dialog id="collectionMoveDialog" class="collection-action-dialog">
    <div class="dialog-head">
      <strong id="collectionMoveTitle">コレクションへ移動</strong>
      <button id="closeCollectionMoveBtn" title="閉じる">×</button>
    </div>
    <div class="collection-dialog-body">
      <label for="collectionMoveSelect">移動先</label>
      <select id="collectionMoveSelect"></select>
      <div class="collection-dialog-actions">
        <button id="cancelCollectionMoveBtn" type="button">キャンセル</button>
        <button id="runCollectionMoveBtn" type="button">移動</button>
      </div>
    </div>
  </dialog>

  <dialog id="exportDialog" class="collection-action-dialog export-dialog">
    <div class="dialog-head">
      <strong id="exportDialogTitle">エクスポート</strong>
      <button id="closeExportBtn" type="button" title="閉じる">×</button>
    </div>
    <div class="collection-dialog-body">
      <p id="exportDescription" class="export-description"></p>
      <label id="exportLocalNameRow" class="export-name-row" for="exportLocalName" hidden>
        <span>ローカル保存名</span>
        <input id="exportLocalName" type="text" autocomplete="off">
        <small>Memo Nexus内のコレクション名は変更されません。</small>
      </label>
      <div id="exportStatus" class="export-status" role="status" aria-live="polite"></div>
      <ul id="exportFailures" class="export-failures" hidden></ul>
      <div class="collection-dialog-actions export-dialog-actions">
        <button id="cancelExportBtn" type="button">キャンセル</button>
        <button id="downloadExportBtn" type="button">ダウンロード</button>
        <button id="localExportBtn" type="button">ローカルフォルダへ保存</button>
      </div>
    </div>
  </dialog>

  <dialog id="imagePreviewDialog" class="image-preview-dialog">
    <div class="dialog-head">
      <strong id="imagePreviewTitle">画像を表示</strong>
      <button id="closeImagePreviewBtn" type="button" title="閉じる" aria-label="画像を閉じる">×</button>
    </div>
    <div class="image-preview-body">
      <img id="imagePreview" alt="">
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="export-utils.js?v=0.4.0-7"></script>
  <script src="attachment-utils.js?v=0.4.0-7"></script>
  <script src="app.js?v=0.4.0-7"></script>
</body>
</html>
