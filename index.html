<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memo Nexus</title>
  <link rel="stylesheet" href="style.css?v=0.3.1-9">
</head>
<body>
  <aside class="sidebar">
    <div class="toolbar">
      <button id="newBtn" title="新規メモ">+</button>
      <button id="todayBtn" title="今日メモ">Today</button>
      <button id="undoBtn" class="undo-button" title="元に戻す" disabled>Undo</button>
      <button id="backupBtn" title="Markdown ZIP出力">ZIP</button>
      <button id="linkStatsBtn" title="語句統計">語句</button>
      <button id="graphBtn" title="グラフを開く">Graph</button>
      <button id="settingsBtn" title="設定">設定</button>
      <button id="deleteBtn" class="danger-button" title="メモを削除">Del</button>
    </div>
    <div class="app-version app-version-mobile"></div>
    <div id="deleteUndoNotice" class="delete-undo-notice" hidden></div>
    <input id="searchInput" type="search" placeholder="検索" autocomplete="off">
    <div id="memoList" class="memo-list"></div>
  </aside>

  <main class="workspace">
    <div id="storageWarning" class="storage-warning" role="status" hidden></div>
    <section class="editor-card">
      <div class="title-row">
        <input id="titleInput" class="title-input" placeholder="無題メモ" autocomplete="off">
        <div class="title-side">
          <div id="saveStatus" class="save-status">保存済み</div>
          <div id="noteMeta" class="note-meta"></div>
        </div>
      </div>
      <textarea id="editor" placeholder="すぐ書けます。[[足利尊氏]] のように書くとリンクになります。"></textarea>
    </section>
    <section class="preview-card">
      <div class="preview-head">
        <span>カード表示</span>
      </div>
      <div id="preview" class="preview"></div>
      <div id="linkList" class="link-list"></div>
      <div id="linkStatsPanel" class="link-stats"></div>
    </section>
  </main>

  <aside class="related-panel">
    <h2>関連メモ</h2>
    <div class="app-version app-version-desktop"></div>
    <div id="relatedList" class="related-list"></div>
    <div id="discoveryPanel" class="discovery-panel"></div>
  </aside>

  <dialog id="graphDialog">
    <div class="dialog-head">
      <strong>知識グラフ</strong>
      <button id="closeGraphBtn" title="閉じる">×</button>
    </div>
    <canvas id="graphCanvas" width="900" height="560"></canvas>
  </dialog>

  <dialog id="settingsDialog" class="settings-dialog">
    <div class="dialog-head">
      <strong>設定</strong>
      <button id="closeSettingsBtn" title="閉じる">×</button>
    </div>
    <div class="settings-body">
      <section class="settings-section">
        <h2>保存状態</h2>
        <dl id="storageStatusDetails" class="settings-details"></dl>
        <p id="storageEstimateMessage" class="settings-note"></p>
      </section>
      <section class="settings-section">
        <h2>取り込み</h2>
        <div class="settings-actions">
          <button id="settingsImportAiBtn" type="button">AIニュースファイル取り込み</button>
          <input id="importAiInput" type="file" accept=".json,.md,.txt,application/json,text/markdown,text/plain" hidden>
          <button id="settingsPasteJsonBtn" type="button">JSON貼り付け取り込み</button>
        </div>
      </section>
      <section class="settings-section">
        <h2>バックアップ</h2>
        <div class="settings-actions">
          <button id="settingsBackupBtn" type="button">Markdown ZIPを書き出す</button>
          <button type="button" class="soon-button" disabled>JSON全体を書き出す <span>Coming soon</span></button>
        </div>
      </section>
      <section class="settings-section">
        <h2>表示</h2>
        <label class="theme-setting" for="themeSelect">
          <span>テーマ</span>
          <select id="themeSelect">
            <option value="light">ライト</option>
            <option value="dark">ダーク</option>
          </select>
        </label>
        <ul class="soon-list">
          <li>フォントサイズ <span>Coming soon</span></li>
          <li>行間 <span>Coming soon</span></li>
          <li>エディタ幅 <span>Coming soon</span></li>
          <li>プレビュー表示切替 <span>Coming soon</span></li>
          <li>関連メモ表示切替 <span>Coming soon</span></li>
          <li>レトロモード <span>Coming soon</span></li>
        </ul>
      </section>
      <section class="settings-section">
        <h2>データ管理</h2>
        <div class="settings-actions">
          <button id="reloadAppBtn" type="button">アプリを再読み込み</button>
          <button type="button" class="soon-button danger-button" disabled>全データ削除 <span>危険操作のため未実装</span></button>
        </div>
      </section>
    </div>
  </dialog>

  <dialog id="jsonImportDialog" class="json-import-dialog">
    <div class="dialog-head">
      <strong>JSON取り込み</strong>
      <button id="closeJsonImportBtn" title="閉じる">×</button>
    </div>
    <div class="json-import-body">
      <textarea id="jsonImportText" placeholder="IT技術ニュースJSONを貼り付け"></textarea>
      <div id="jsonImportError" class="json-import-error" aria-live="polite"></div>
      <div class="json-import-actions">
        <button id="cancelJsonImportBtn" type="button">キャンセル</button>
        <button id="runJsonImportBtn" type="button">取り込み</button>
      </div>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="app.js?v=0.3.1-9"></script>
</body>
</html>
